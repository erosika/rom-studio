version: "0.1.0"
title: ROM Studio
description: "Make your own small game by talking with your agent, one scene at a time, from a decomp (the community-made source of an original handheld game) that you supply. A pane in the desktop app shows each change as a plain sentence with a picture taken from the running game, a play link, the scene list, a gallery, maps, music, the dialogue with your notes on it, a source search, the agent's open questions and settings; you answer with Looks right or Needs work. The package also carries a command-line kit the agent runs (set up, build, play, pictures, button presses, maps, notes, keep, undo, patch; the same 26 commands as an MCP server you can add yourself), a browser player with a flash guard that is always on, and the make-your-game skill, which the plugin registers. ROM Studio names and fetches no game or engine; sharing is a patch, never a built game. The plugin registers no tools, hooks or middleware. Disclosure — once you set a game folder, the plugin starts one background process, bun pane/server.ts, bound to 127.0.0.1 (port 8778 by default), and stops it on unload; from 127.0.0.1 that page needs no sign-in, so programs on your own computer can read the game folder through it, use its controls and start a setup into an empty game folder; pages on other sites and requests under a host name that is not this computer's are refused, uploads are size-limited, and it is reachable from another device only if you start it yourself with --bind, and then only through the link with its key (kept in the plugin's data folder). The kit, run by your agent under Hermes's normal approvals, runs shell commands (git, make, compilers, python3, ffmpeg, curl, openssl) and your decomp's own build scripts, so use a decomp you trust. kit setup, never plugin load, downloads the script compiler (a prebuilt Linux program from its author's GitHub release, checked against a sha256 in kit/kit.ts) and the npm package @thenick775/mgba-wasm 2.6.0 (pinned by sha512 in player/bun.lock), and compiles a small headless emulator from kit/emu/studio-emu.c against a libmgba you build yourself; these land inside the plugin folder. kit play serves the built game on 127.0.0.1, and with --phone on your private network over https with a self-made certificate and a key in the link. The optional base patches for one engine version are not shipped; only a game built with them has a START menu agent entry, which in the player sends the words you type to your own hermes command (hermes chat, one conversation named rom-studio-game, stopped after 60 seconds) with your agent's normal tools and approvals and no flag that changes them; hermes_link false in the game folder's settings.json turns it off. The player also passes /pane/ on to the local pane, and ROM_STUDIO_HOSTS lists extra host names both servers answer to, for an owner who puts their own reverse proxy in front. It writes to the game folder, to <HERMES_HOME>/plugin-data/rom-studio and to its own caches; no telemetry, no credentials, no .env reads, no self-update, nothing sent anywhere. Linux only."
