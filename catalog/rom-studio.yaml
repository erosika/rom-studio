known_issues:
  - "Not yet seen running inside the desktop app: the plugin passes hermes plugins validate and doctor and its halves were run outside a host, but the pane in the app, the feed event arriving and the skill loaded through the plugin are untested."
  - "Linux only. macOS and Windows are not supported (the build scripts use Linux tools and the script compiler download is a Linux program); Windows through WSL has not been tried."
  - "Needs bun, git and a toolchain for the game that you install yourself: make, python3 with Pillow, C and C++ compilers, flock, libpng with pkg-config, arm-none-eabi-gcc 14.2, cmake and a libmgba 0.10.5 you build once; ffmpeg for sound. kit status lists what is missing and how to get it."
  - "You bring the decomp and, to make a patch, your own copy of the original game file. ROM Studio includes and fetches neither. The first build takes about 7 minutes and a game folder about 1 GB."
  - "The optional base (calm changes inside the game, quick start, the test hook, the in-game agent entry) is patches for one version of one engine and is not shipped. Without it the flag, creature-gift and exact-text steps are unavailable, each new build plays through the original opening once, and the in-game agent link is absent. The player's flash guard is always on regardless."
  - "The phone link of the player (kit play --phone) has not been tried on a real phone. The kit's MCP server has been tried over stdio by hand, not inside Hermes."
  - "Setup's caches (headless emulator, script compiler, browser emulator) live inside the plugin folder; if an update removes them, run kit setup again."
  - "A setting change needs a restart of Hermes. The kit does not read the plugin's settings: for a game folder other than the default, also set ROM_STUDIO_GAME where your agent's commands run."
